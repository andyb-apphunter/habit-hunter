<script id="logic">
/* Dates are plain YYYY-MM-DD strings, which also sort correctly. */
const DAY_NAMES=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"], MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const pad=n=>String(n).padStart(2,"0");
const toISO=d=>`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;
const utc=s=>new Date(Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10)));
const addDays=(s,n)=>{const d=utc(s);d.setUTCDate(d.getUTCDate()+n);return toISO(d)};
const weekday=s=>(utc(s).getUTCDay()+6)%7;
const monday=s=>addDays(s,-weekday(s));
const daysInMonth=s=>new Date(Date.UTC(+s.slice(0,4),+s.slice(5,7),0)).getUTCDate();
const monthStart=s=>s.slice(0,8)+"01";
const monthEnd=s=>s.slice(0,8)+pad(daysInMonth(s));
const diffDays=(a,b)=>Math.round((utc(a)-utc(b))/864e5);
const short=s=>`${DAY_NAMES[weekday(s)]} ${+s.slice(8)} ${MONTHS[+s.slice(5,7)-1]}`;
const nice=s=>`${short(s)} ${s.slice(0,4)}`;
const plural=(n,w)=>`${n} ${w}${n===1?"":"s"}`;
const pct=r=>r==null?"–":`${Math.round(r*100)}%`;

const FREQ={daily:"Every day",weekdays:"Certain days of the week",weekly:"A number of times a week",every:"Every few days",monthly:"Once a month"};
const COLOUR_NAMES=["Purple","Blue","Pink","Green","Amber","Grey","Coral","Teal","Olive","Indigo"];
const goalType=h=>h.goalType||"once";
const goalAmount=h=>+h.goalAmount||1;
const fmtMin=n=>n<60?`${n} min`:`${Math.floor(n/60)} h${n%60?` ${n%60} min`:""}`;
const fmtAmount=(type,n)=>type==="minutes"?fmtMin(n):plural(n,"time");
function goalText(h){const t=goalType(h);return t==="once"?"":`${fmtAmount(t,goalAmount(h))} a day`}
/* A day's record is either a comment string (a plain tick) or {c:comment,s:[session amounts],t:that day's target}. */
function normEntry(e){if(e==null)return null;if(typeof e==="string")return{c:e,s:[],t:0};return{c:e.c||"",s:e.s||[],t:e.t||0}}
const entrySum=e=>e.s.reduce((a,b)=>a+b,0);
const entryComplete=e=>e.t===0||entrySum(e)>=e.t;
const wanted=h=>String(h.value).split(",").filter(x=>x!=="").map(Number);
function freqText(h){
  const v=h.value;
  if(h.freq==="daily")return"Every day";
  if(h.freq==="weekdays"){const d=wanted(h).sort((a,b)=>a-b),k=d.join();
    return k==="0,1,2,3,4"?"Weekdays":k==="5,6"?"Weekends":d.map(i=>DAY_NAMES[i]).join(", ")}
  if(h.freq==="weekly")return`${plural(+v,"time")} a week`;
  if(h.freq==="every")return`Every ${v} days`;
  const n=+v,s=n%100>=11&&n%100<=13?"th":({1:"st",2:"nd",3:"rd"})[n%10]||"th";
  return`Monthly, on the ${n}${s}`;
}
function streakUnit(h,n){return({daily:plural(n,"day"),weekly:plural(n,"week"),monthly:plural(n,"month")})[h.freq]||`${n} in a row`}
const isPausedOn=(h,d)=>(h.pauses||[]).some(([s,e])=>s<=d&&(e==null||d<e));
const isActive=(h,d)=>d>=h.start&&!isPausedOn(h,d);
const monthlyDue=(h,d)=>Math.min(+h.value,daysInMonth(d));
function count(done,s,e,skip){let n=0;for(const x of done)if(x>=s&&x<=e&&x!==skip)n++;return n}
function usableDays(h,wk){let n=0;for(let i=0;i<7;i++)if(isActive(h,addDays(wk,i)))n++;return n}

/* Every stretch with a target (a day, a week, a round, a month) from the start date to now. */
function periods(h,done,now){
  if(h.start>now)return[];
  const out=[],add=(s,e,t)=>out.push({start:s,end:e,target:t,got:count(done,s,e),open:e>=now});
  if(h.freq==="daily"||h.freq==="weekdays"){
    const w=h.freq==="daily"?null:new Set(wanted(h));
    for(let d=h.start;d<=now;d=addDays(d,1))if((!w||w.has(weekday(d)))&&isActive(h,d))add(d,d,1);
  }else if(h.freq==="weekly"){
    for(let wk=monday(h.start);wk<=now;wk=addDays(wk,7)){const u=usableDays(h,wk);if(u)add(wk,addDays(wk,6),Math.min(+h.value,u))}
  }else if(h.freq==="every"){
    const n=+h.value;
    for(let s=h.start;s<=now;s=addDays(s,n)){let any=false;for(let i=0;i<n&&!any;i++)any=isActive(h,addDays(s,i));if(any)add(s,addDays(s,n-1),1)}
  }else{
    for(let m=monthStart(h.start);m<=now;m=addDays(monthEnd(m),1)){
      const due=m.slice(0,8)+pad(monthlyDue(h,m));
      if(h.start<=due&&due<=now&&isActive(h,due))add(m,monthEnd(m),1);
    }
  }
  return out;
}
/* Unfinished current periods never count against you. */
function computeStats(h,done,now,since){
  const st={done:0,due:0,current:0,best:0,total:done.size};let run=0;
  for(const p of periods(h,done,now)){
    const credit=Math.min(p.got,p.target),met=p.got>=p.target;
    if(since==null||(p.end<now?p.end:now)>=since){st.done+=credit;st.due+=p.open?credit:p.target}
    if(met){run++;st.best=Math.max(st.best,run)}else if(!p.open)run=0;
  }
  st.current=run;st.rate=st.due?st.done/st.due:null;return st;
}
/* What a habit needs on one day. Returns null if it isn't running that day. */
function dayState(h,done,d){
  if(!isActive(h,d))return null;
  if(h.freq==="daily")return{due:true,note:""};
  if(h.freq==="weekdays")return{due:wanted(h).includes(weekday(d)),note:""};
  if(h.freq==="weekly"){
    const wk=monday(d),end=addDays(wk,6),target=Math.min(+h.value,usableDays(h,wk)),got=count(done,wk,end);
    const due=count(done,wk,end,d)<target;
    return{due,note:due?`${Math.min(got,target)} of ${target} this week`:"Target reached this week"};
  }
  if(h.freq==="every"){
    const n=+h.value,s=addDays(d,-(diffDays(d,h.start)%n)),end=addDays(s,n-1),due=count(done,s,end,d)===0;
    return{due,note:due?`Due by ${short(end)}`:"Already done this round"};
  }
  const dd=d.slice(0,8)+pad(monthlyDue(h,d));
  if(d<dd||dd<h.start)return{due:false,note:""};
  const due=count(done,monthStart(d),monthEnd(d),d)===0;
  return{due,note:due?"Due this month":"Already done this month"};
}
function nextDue(h,done,d){for(let i=1,x=addDays(d,1);i<=370;i++,x=addDays(x,1)){const s=dayState(h,done,x);if(s&&s.due)return x}return null}
function weeklyRates(hs,doneOf,weeks,now){
  const first=addDays(monday(now),-7*(weeks-1)),tally={};
  for(let i=0;i<weeks;i++)tally[addDays(first,7*i)]=[0,0];
  for(const h of hs)for(const p of periods(h,doneOf(h.id),now)){
    const w=monday(p.end<now?p.end:now);
    if(tally[w]){const c=Math.min(p.got,p.target);tally[w][0]+=c;tally[w][1]+=p.open?c:p.target}
  }
  return Object.keys(tally).sort().map(w=>({week:w,rate:tally[w][1]?tally[w][0]/tally[w][1]:null}));
}
function trailingRate(hs,doneOf,days,now){
  const since=addDays(now,-(days-1));let a=0,b=0;
  for(const h of hs){const s=computeStats(h,doneOf(h.id),now,since);a+=s.done;b+=s.due}
  return b?a/b:null;
}
</script>

<script>
const TICK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
const localToday=()=>{const d=new Date();return`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const $=id=>document.getElementById(id);
const VERSION="0.6.0",BETA=false;
const S={tab:"Today",today:localToday(),day:localToday(),habits:{},logs:{},settings:{theme:"lavender",lastBackup:null,backupSnooze:null},feedback:[],uid:null,email:"",authKnown:false,signErr:"",loaded:false,slow:false,blocked:"",
  editing:null,logging:null,full:false,statHabit:"",commentHabit:"",search:"",limit:60,dirty:false,downloads:null,bar:{}};

/* ---------- reading the data ---------- */
const habits=()=>Object.values(S.habits).sort((a,b)=>(a.created||"").localeCompare(b.created||"")||a.name.localeCompare(b.name));
function daysOf(hid){const out={};for(const l of Object.values(S.logs))if(l.habit===hid)Object.assign(out,l.days);return out}
let doneCache=null;
function doneOf(hid){doneCache=doneCache||{};if(doneCache[hid])return doneCache[hid];const days=daysOf(hid);return doneCache[hid]=new Set(Object.keys(days).filter(d=>entryComplete(normEntry(days[d]))))}
const touched=()=>{doneCache=null};
const logId=(hid,day)=>`${hid}_${day.slice(0,4)}`;
const isDone=(hid,day)=>doneOf(hid).has(day);
const entryOf=(hid,day)=>{const l=S.logs[logId(hid,day)];return l?normEntry(l.days[day]):null};
const commentOf=(hid,day)=>{const e=entryOf(hid,day);return e?e.c:""};

/* ---------- saving: your habits live in your account, with an offline copy on each device ---------- */
const Cloud=window.HHCloud;
function cloudError(e){console.warn(e);toast(e&&e.code==="permission-denied"?"You're signed out. Sign in again to save changes.":"That change couldn't be saved. Check your connection and try again.")}
/* Firestore can't hold a list inside a list, so pauses travel as {s,e} pairs. */
const toCloudHabit=h=>{const{id,...b}=h;return{...b,pauses:(h.pauses||[]).map(([a,e])=>({s:a,e:e==null?null:e}))}};
const fromCloudHabit=(id,d)=>({...d,id,pauses:(d.pauses||[]).map(p=>Array.isArray(p)?p:[p.s,p.e==null?null:p.e])});
const toCloudLog=l=>({habit:l.habit,year:l.year,days:{...l.days}});
function saveLog(id){if(!S.uid)return;const l=S.logs[id];(l?Cloud.setLog(S.uid,id,toCloudLog(l)):Cloud.delLog(S.uid,id)).catch(cloudError)}
function persist(){if(!S.uid)return;Cloud.setSettings(S.uid,{theme:S.settings.theme||"lavender",lastBackup:S.settings.lastBackup||null,backupSnooze:S.settings.backupSnooze||null}).catch(cloudError)}
function snapshot(){return{format:1,app:"habit-hunter",version:VERSION,habits:S.habits,logs:S.logs,settings:S.settings}}
function setDone(hid,day,done){
  const id=logId(hid,day);
  if(done){(S.logs[id]=S.logs[id]||{habit:hid,year:+day.slice(0,4),days:{}}).days[day]=commentOf(hid,day)}
  else if(S.logs[id])delete S.logs[id].days[day];
  touched();saveLog(id);
}
function setComment(hid,day,text){
  const id=logId(hid,day),t=text.trim();
  if(!S.logs[id]||!(day in S.logs[id].days))return;
  const raw=S.logs[id].days[day];
  if(normEntry(raw).c===t)return;
  S.logs[id].days[day]=typeof raw==="string"?t:{...raw,c:t};saveLog(id);
}
function logSession(h,day,amount){
  const id=logId(h.id,day),l=S.logs[id]=S.logs[id]||{habit:h.id,year:+day.slice(0,4),days:{}};
  const e=normEntry(l.days[day])||{c:"",s:[],t:goalAmount(h)};
  l.days[day]={c:e.c,s:[...e.s,amount],t:e.t===0?0:goalAmount(h)};
  touched();saveLog(id);
}
function removeSession(h,day,i){
  const id=logId(h.id,day),e=normEntry(S.logs[id].days[day]),s=e.s.filter((_,k)=>k!==i);
  S.logs[id].days[day]={c:e.c,s,t:e.t};
  touched();saveLog(id);
}
function totalAmount(h){let n=0;for(const v of Object.values(daysOf(h.id)))n+=entrySum(normEntry(v));return n}
function saveHabit(h){S.habits[h.id]=h;if(S.uid)Cloud.setHabit(S.uid,h.id,toCloudHabit(h)).catch(cloudError)}
function deleteHabit(h){
  delete S.habits[h.id];if(S.uid)Cloud.delHabit(S.uid,h.id).catch(cloudError);
  for(const id of Object.keys(S.logs))if(S.logs[id].habit===h.id){delete S.logs[id];saveLog(id)}
  touched();
}

/* ---------- screen updates ---------- */
function typingInView(){const a=document.activeElement;return a&&$("view").contains(a)&&/^(TEXTAREA|INPUT)$/.test(a.tagName)}
function render(force){
  if(!force&&typingInView()){S.dirty=true;return}
  S.dirty=false;
  const sc=window.scrollY;
  $("tabs").innerHTML=["Today","Habits","Stats","Comments","More"].map(t=>`<button data-act="tab" data-v="${t}" ${t===S.tab?'aria-current="page"':""}>${t}</button>`).join("");
  document.querySelector("nav").hidden=!S.uid;
  $("view").innerHTML=(S.uid?({Today:viewToday,Habits:viewHabits,Stats:viewStats,Comments:viewComments,More:viewMore})[S.tab]:viewSignIn)();
  if(S.tab==="Stats"){const h=$("heatScroll");if(h)h.scrollLeft=h.scrollWidth}
  window.scrollTo(0,sc);
}
function banner(){
  if(S.blocked)return`<div class="status">${esc(S.blocked)}</div>`;
  return"";
}
function addBtn(){return `<button class="btn pink" data-act="add">+ Add</button>`}

function viewToday(){
  const d=S.day,isToday=d===S.today,due=[],extra=[];
  for(const h of habits()){const st=dayState(h,doneOf(h.id),d);if(st)(st.due?due:extra).push([h,st])}
  const n=due.filter(([h])=>isDone(h.id,d)).length,ex=extra.filter(([h])=>isDone(h.id,d)).length;
  let summary=due.length?`${n} of ${due.length} done${n===due.length?". All done!":""}`:"Nothing due";
  if(ex)summary+=`, plus ${ex} extra`;
  let h=banner()+`<div class="head"><h1>${isToday?"Today":short(d)}</h1>${BETA?`<button class="beta" data-act="feedback">Beta</button>`:""}${addBtn()}</div>${backupNudge()}
  <div class="row"><button class="btn ghost icon" data-act="shift" data-v="-1" aria-label="Previous day">‹</button>
   <input class="grow" id="jump" type="date" max="${S.today}" value="${d}" aria-label="Choose a date" data-change="jump">
   <button class="btn ghost icon" data-act="shift" data-v="1" aria-label="Next day" ${isToday?"disabled":""}>›</button>
   ${isToday?"":`<button class="btn blue" data-act="jumpToday">Today</button>`}</div>`;
  if(!habits().length){
    if(S.blocked)return h;
    h+=S.loaded?`<div class="card empty"><h2>Your first habit</h2><div class="muted">Add something you want to do regularly. It appears here on the days it's due.</div><button class="btn pink" data-act="add">+ Add a habit</button>
      <div class="label" style="margin-top:8px">Or start with one of these</div><div class="chips" style="justify-content:center">${QUICK.map((q,i)=>`<button class="btn ghost slim" data-act="quick" data-v="${i}">${esc(q.label)}</button>`).join("")}</div></div>`
      :`<div class="card empty muted">Loading your habits…</div>`;
    return h;
  }
  h+=`<div class="muted small" id="summary">${summary}</div><div class="progress" role="progressbar" aria-valuenow="${n}" aria-valuemax="${due.length}"><div style="width:${due.length?n/due.length*100:0}%"></div></div>`;
  h+=due.map(([x,st])=>rowToday(x,st,d,false)).join("");
  if(extra.length)h+=`<div class="label section">Not due, but you can still tick them</div>`+extra.map(([x,st])=>rowToday(x,st,d,true)).join("");
  return h;
}
function rowToday(h,st,d,faded){
  const done=isDone(h.id,d),stats=computeStats(h,doneOf(h.id),S.today),bits=[freqText(h)];
  if(st.note)bits.push(st.note);else if(faded&&!done){const nx=nextDue(h,doneOf(h.id),d);if(nx)bits.push(`Next due ${short(nx)}`)}
  if(stats.current)bits.push(`Streak: ${streakUnit(h,stats.current)}`);
  const type=goalType(h),e=entryOf(h.id,d),sum=e?entrySum(e):0,target=e&&e.t?e.t:goalAmount(h);
  if(type!=="once")bits.splice(1,0,sum?`${fmtAmount(type,sum)} of ${fmtAmount(type,target)} today`:goalText(h));
  const c=e?e.c:"",ed=S.editing&&S.editing.hid===h.id&&S.editing.day===d;
  const box=type==="once"||done?TICK:`<span class="amt">${sum}<br>of ${target}</span>`;
  let below="";
  if(type!=="once"&&S.logging&&S.logging.hid===h.id&&S.logging.day===d){
    const left=Math.max(target-sum,0)||target;
    below+=`<div class="logger"><div class="label">How many minutes was this session?</div><div class="chips">${[5,10,15,20,30].map(n=>`<button class="btn ghost slim" data-act="logMin" data-h="${h.id}" data-v="${n}">${n}</button>`).join("")}</div>
    <div class="custom"><input id="min-${h.id}" type="number" inputmode="numeric" min="1" max="1440" value="${left}" aria-label="Minutes"><button class="btn slim" data-act="logMinInput" data-h="${h.id}">Add</button><button class="btn ghost slim" data-act="logClose">Cancel</button></div></div>`;
  }
  if(type!=="once"&&e){
    if(type==="minutes"&&e.s.length)below+=`<div class="sessions">${e.s.map((n,i)=>`<button class="sess" data-act="rmSess" data-h="${h.id}" data-i="${i}" aria-label="Remove ${fmtMin(n)} session">${fmtMin(n)} ✕</button>`).join("")}</div>`;
    if(type==="times"&&e.s.length)below+=`<div class="sessions"><button class="linkish" data-act="rmSess" data-h="${h.id}" data-i="${e.s.length-1}">Remove one</button></div>`;
    if(!e.s.length&&e.t===0)below+=`<div class="sessions"><button class="linkish" data-act="rmTick" data-h="${h.id}">Remove tick</button></div>`;
  }
  if(ed)below+=`<div class="editor"><textarea id="note-${h.id}" data-input="note" placeholder="Add a comment (optional)" aria-label="Comment for ${esc(h.name)}">${esc(c)}</textarea><button class="btn slim" data-act="noteDone">Done</button></div>`;
  else if(c)below+=`<div class="note"><span>${esc(c)}</span><button class="linkish" data-act="noteEdit" data-h="${h.id}">Edit</button></div>`;
  else if(e&&(done||e.s.length))below+=`<div class="note"><button class="linkish" data-act="noteEdit" data-h="${h.id}">Add comment</button></div>`;
  return`<div class="card c${h.colour||0} ${faded?"faded":""}"><div class="row">
    <button class="tick" data-act="tick" data-h="${h.id}" aria-pressed="${done}" aria-label="${esc(h.name)}">${box}</button>
    <div class="grow"><div class="name">${esc(h.name)}</div><div class="muted small">${esc(bits.join(" · "))}</div></div></div>${below}</div>`;
}

function viewHabits(){
  const paused=h=>isPausedOn(h,S.today)?1:0,list=habits().sort((a,b)=>paused(a)-paused(b));
  let h=banner()+`<div class="head"><h1>Habits</h1>${addBtn()}</div>`;
  if(!list.length)h+=`<div class="card empty muted">${S.loaded?"No habits yet. Tap + Add to create one.":"Loading your habits…"}</div>`;
  for(const x of list){
    const st=computeStats(x,doneOf(x.id),S.today),p=paused(x);
    h+=`<div class="card c${x.colour||0} ${p?"faded":""}"><div class="row"><span class="chip">${esc(x.name)}${p?" (paused)":""}</span></div>
    <div class="muted small" style="margin-top:6px">${esc(freqText(x))}${goalType(x)==="once"?"":` · ${goalText(x)}`} · ${x.start>S.today?"Starts":"Started"} ${nice(x.start)}<br>${st.rate==null?"Nothing due yet":pct(st.rate)+" complete"} · Best streak: ${streakUnit(x,st.best)}</div>
    <div class="actions"><button class="btn ghost slim" data-act="toStats" data-h="${x.id}">Stats</button><button class="btn ghost slim" data-act="toComments" data-h="${x.id}">Comments</button>
    <button class="btn ghost slim" data-act="edit" data-h="${x.id}">Edit</button><button class="btn ghost slim" data-act="pause" data-h="${x.id}">${p?"Resume":"Pause"}</button>
    <button class="btn ghost slim" data-act="del" data-h="${x.id}">Delete</button></div></div>`;
  }
  return h;
}

function habitSelect(id,val,change){
  return`<select id="${id}" data-change="${change}" aria-label="Filter by habit"><option value="">All habits</option>${habits().map(h=>`<option value="${h.id}" ${h.id===val?"selected":""}>${esc(h.name)}</option>`).join("")}</select>`;
}
function bars(key,items,fmt,top){
  const sel=S.bar[key];
  return`<div class="bars"><span class="yaxis" style="top:0">${fmt(top)}</span><span class="yaxis" style="top:50%">${fmt(top/2)}</span><span class="yaxis" style="top:100%">${fmt(0)}</span>
  ${items.map((b,i)=>`<button class="bar" data-act="bar" data-k="${key}" data-i="${i}" aria-pressed="${sel===i}" aria-label="${esc(b.tip)}" title="${esc(b.tip)}"><i style="height:${b.value/top*100}%"></i></button>`).join("")}</div>
  <div class="xlab">${items.map(b=>`<span>${b.show?esc(b.name):""}</span>`).join("")}</div>
  <div class="readout">${sel!=null&&items[sel]?esc(items[sel].tip):"Tap a bar for its value."}</div>`;
}
function viewStats(){
  if(S.statHabit&&!S.habits[S.statHabit])S.statHabit="";
  const all=habits(),hs=S.statHabit?[S.habits[S.statHabit]]:all,now=S.today;
  let h=banner()+`<div class="head"><h1>Stats</h1>${all.length?`<button class="btn ghost" data-act="fsToggle">${S.full?"Exit full screen":"⤢ Full screen"}</button>`:""}</div>`;
  if(!all.length)return h+`<div class="card empty muted">${S.loaded?"Add a habit and your stats appear here.":"Loading your habits…"}</div>`;
  h+=habitSelect("statPick",S.statHabit,"statPick");
  const stats=hs.map(x=>computeStats(x,doneOf(x.id),now));
  const due=stats.reduce((a,s)=>a+s.due,0),got=stats.reduce((a,s)=>a+s.done,0),total=stats.reduce((a,s)=>a+s.total,0);
  const pick=f=>{let b=0;stats.forEach((s,i)=>{if(s[f]>stats[b][f])b=i});return streakUnit(hs[b],stats[b][f])};
  const tiles=[[pct(due?got/due:null),"All time"],[pct(trailingRate(hs,doneOf,7,now)),"Last 7 days"],[pct(trailingRate(hs,doneOf,30,now)),"Last 30 days"],
    [pick("current"),hs.length>1?"Longest current streak":"Current streak"],[pick("best"),hs.length>1?"Best streak ever":"Best streak"],[total.toLocaleString(),"Times completed"]];
  h+=`<div class="tiles">${tiles.map(([b,s])=>`<div class="tile"><b>${esc(b)}</b><span>${s}</span></div>`).join("")}</div>`;

  /* calendar */
  const counts={};for(const x of hs)for(const d of doneOf(x.id))counts[d]=(counts[d]||0)+1;
  const weeks=52,first=addDays(monday(now),-7*(weeks-1));let cells="",months="",last="";
  for(let w=0;w<weeks;w++){
    const wk=addDays(first,7*w),m=wk.slice(5,7);
    months+=`<span>${m!==last&&w<weeks-1?MONTHS[+m-1]:""}</span>`;last=m;
    for(let i=0;i<7;i++){const d=addDays(wk,i);
      if(d>now){cells+="<span></span>";continue}
      const n=counts[d]||0,mx=Math.max(hs.length,1),lvl=!n?0:mx===1?3:Math.min(4,1+Math.floor((n-1)*4/mx));
      cells+=`<i class="${d===now?"now":""}" style="background:var(--heat${lvl})" data-act="openDay" data-v="${d}" title="${nice(d)}: ${n} completed"></i>`}
  }
  h+=`<div class="card"><h2>Completions over the last year</h2><div class="muted small">Tap a day to open it. Scroll sideways for earlier months.</div>

  /* charts */
  const wr=weeklyRates(hs,doneOf,12,now);

  ${bars("week",wr.map((r,i)=>({name:`${+r.week.slice(8)}/${+r.week.slice(5,7)}`,show:i%3===2,value:r.rate||0,tip:`Week of ${short(r.week)}: ${r.rate==null?"nothing due":pct(r.rate)}`})),v=>`${Math.round(v*100)}%`,1)}</div>`;
  const wd=[0,0,0,0,0,0,0];for(const x of hs)for(const d of doneOf(x.id))wd[weekday(d)]++;
  let top=Math.max(...wd,2);if(top%2)top++;

  /* each habit */
  h+=`<div class="card"><h2>Each habit</h2>${hs.map((x,i)=>{const s=stats[i];
    return`<div class="c${x.colour||0}" style="margin-top:12px"><span class="chip">${esc(x.name)}${isPausedOn(x,now)?" (paused)":""}</span>
    <div class="kv"><div><b>${pct(s.rate)}</b><span>All time</span></div><div><b>${pct(trailingRate([x],doneOf,30,now))}</b><span>Last 30 days</span></div>

  return h;
}

async function shareFile(name,type,text){
  const file=new File([text],name,{type});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return true}}
  catch(e){if(e&&e.name==="AbortError")return false}
  const a=document.createElement("a");a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return true;
}
async function backup(){
  const data={...snapshot(),exported:new Date().toISOString()};delete data.feedback;
  const ok=await shareFile(`habit-hunter-backup-${S.today}.json`,"application/json",JSON.stringify(data));
  if(ok){S.settings.lastBackup=new Date().toISOString();persist();toast("Backup saved. Keep the file somewhere safe.");render(true)}
}
function validBackup(b){return b&&b.app==="habit-hunter"&&b.habits&&typeof b.habits==="object"&&b.logs&&typeof b.logs==="object"}
function restoreFrom(file){
  const r=new FileReader();
  r.onload=()=>{let b=null;try{b=JSON.parse(r.result)}catch(e){}
    if(!validBackup(b)){toast("That file isn't a Habit Hunter backup.");return}
    const n=Object.keys(b.habits).length,when=b.exported?nice(b.exported.slice(0,10)):"an unknown date";
    confirmSheet("Restore this backup?",`It has ${plural(n,"habit")}, saved on ${when}. Everything on this phone now will be replaced.`,"Restore",()=>{
      S.habits={};for(const[id,h]of Object.entries(b.habits))S.habits[id]={...h,id};
      S.logs={};for(const[id,l]of Object.entries(b.logs))S.logs[id]={habit:l.habit,year:l.year,days:{...(l.days||{})}};
      if(b.settings&&b.settings.theme)S.settings.theme=b.settings.theme;
      const hs={};for(const[id,h]of Object.entries(S.habits))hs[id]=toCloudHabit(h);const ls={};for(const[id,l]of Object.entries(S.logs))ls[id]=toCloudLog(l);
      Cloud.replaceAll(S.uid,hs,ls).catch(cloudError);touched();applyTheme();persist();S.tab="Today";render(true);toast(`Restored ${plural(n,"habit")}.`)})};
  r.readAsText(file);
}
function applyTheme(){

function saveForm(){

  if(F.freq==="weekdays"){if(!F.days.length)return err("Pick at least one day.");value=[...F.days].sort((a,b)=>a-b).join(",")}
  const num=(v,a,b,w)=>{const n=Number(v);if(!Number.isInteger(n)||n<a||n>b){err(`${w} must be a number from ${a} to ${b}.`);return null}return n};
  if(F.freq==="weekly"&&(value=num(F.times,1,7,"Times per week"))===null)return;

    if(!done){try{await navigator.clipboard.writeText(text);toast("Copied. Paste it into a message or email to Andrew.");done=true}catch(e){toast("Couldn't share or copy here.")}}
    if(done){S.feedback=S.feedback.map(f=>({...f,sent:true}));persist();render(true)}},
  fbClear(){S.feedback=S.feedback.filter(f=>!f.sent);persist();render(true)},
  tab(el){closeEditor();S.logging=null;S.tab=el.dataset.v;window.scrollTo(0,0);render(true)},
  add(){closeEditor();render(true);habitForm()},
  shift(el){closeEditor();S.logging=null;const d=addDays(S.day,+el.dataset.v);S.day=d>S.today?S.today:d;render(true)},
  jumpToday(){closeEditor();S.day=S.today;render(true)},
  tick(el){
    const hid=el.dataset.h,d=S.day,type=goalType(S.habits[hid]);
    if(type==="times"){const was=isDone(hid,d);closeEditor();S.logging=null;logSession(S.habits[hid],d,1);if(!was&&isDone(hid,d))S.editing={hid,day:d};render(true);return}
    if(type==="minutes"){closeEditor();S.logging=S.logging&&S.logging.hid===hid?null:{hid,day:d};render(true);return}
    if(isDone(hid,d)){
      const box=$(`note-${hid}`),text=box?box.value.trim():commentOf(hid,d);
      if(text){if(box)setComment(hid,d,text);confirmSheet("Remove this tick?","This day's comment will be deleted as well.","Remove",()=>untick(hid,d));return}
      untick(hid,d);return;
    }
    closeEditor();setDone(hid,d,true);S.editing={hid,day:d};render(true);
  },
  logMin(el){addMinutes(el.dataset.h,+el.dataset.v)},
  logMinInput(el){const n=Number($(`min-${el.dataset.h}`).value);if(!Number.isInteger(n)||n<1||n>1440){toast("Enter whole minutes from 1 to 1440.");return}addMinutes(el.dataset.h,n)},
  logClose(){S.logging=null;render(true)},
  rmSess(el){const hid=el.dataset.h,d=S.day,h=S.habits[hid],e=entryOf(hid,d),i=+el.dataset.i;
    if(e.s.length===1&&e.c){confirmSheet("Remove this session?","It's the only one that day, so the comment will be deleted as well.","Remove",()=>untick(hid,d));return}
    if(e.s.length===1){untick(hid,d);return}
    removeSession(h,d,i);render(true)},
  rmTick(el){const hid=el.dataset.h,d=S.day;
    if(commentOf(hid,d)){confirmSheet("Remove this tick?","This day's comment will be deleted as well.","Remove",()=>untick(hid,d));return}
    untick(hid,d)},
  noteDone(){closeEditor();render(true)},
  noteEdit(el){closeEditor();S.editing={hid:el.dataset.h,day:S.day};render(true);const e=$(`note-${el.dataset.h}`);if(e)e.focus()},
  edit(el){habitForm(S.habits[el.dataset.h])},
  pause(el){const h=S.habits[el.dataset.h],t=S.today;let p=(h.pauses||[]).map(x=>[...x]);
    if(isPausedOn(h,t)){p=p.map(([s,e])=>[s,e==null?t:e]).filter(([s,e])=>s<e)}else p.push([t,null]);
    saveHabit({...h,pauses:p});render(true)},
  del(el){const h=S.habits[el.dataset.h],days=daysOf(h.id),n=Object.keys(days).length,c=Object.values(days).filter(v=>normEntry(v).c).length;
    confirmSheet(`Delete ${h.name}?`,`This permanently removes the habit, ${plural(n,"completion")} and ${plural(c,"comment")}. To stop it without losing anything, use Pause.`,"Delete",()=>{deleteHabit(h);render(true)})},
  toStats(el){S.statHabit=el.dataset.h;S.tab="Stats";window.scrollTo(0,0);render(true)},
  toComments(el){S.commentHabit=el.dataset.h;S.search="";S.tab="Comments";window.scrollTo(0,0);render(true)},
  bar(el){S.bar[el.dataset.k]=+el.dataset.i;render(true)},
  openDay(el){setFull(false,true);S.day=el.dataset.v;S.tab="Today";window.scrollTo(0,0);render(true)},
  more(){S.limit+=60;render(true)},
  cEdit(el){const hid=el.dataset.h,d=el.dataset.v;F={hid,d};
    openSheet(`<h2>${esc(S.habits[hid].name)}</h2><div class="muted small">${nice(d)}</div><textarea id="cBox" rows="5" aria-label="Comment">${esc(commentOf(hid,d))}</textarea>
    <div class="foot"><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="cSave">Save</button></div>`)},
  cSave(){const t=$("cBox").value;setComment(F.hid,F.d,t);closeSheet();render(true)},
  cDel(el){const hid=el.dataset.h,d=el.dataset.v;confirmSheet("Delete this comment?","The day stays ticked off. Only the comment is removed.","Delete",()=>{setComment(hid,d,"");render(true)})},
  close(){closeSheet()},
  yes(){const f=confirmYes;confirmYes=null;closeSheet();if(f)f()},
  fSave(){saveForm()},
  fCol(el){F.colour=+el.dataset.v;drawSwatches()},
  fDay(el){const i=+el.dataset.v;F.days=F.days.includes(i)?F.days.filter(x=>x!==i):[...F.days,i];drawDetail()},
  async export(){
    const q=v=>`"${String(v).replace(/"/g,'""')}"`,rows=[["Date","Habit","Comment","Amount"]];
    for(const h of habits()){const days=daysOf(h.id);for(const d of Object.keys(days)){const e=normEntry(days[d]),n=entrySum(e);rows.push([d,h.name,e.c,n?fmtAmount(goalType(h),n):""])}}
    const body=[rows[0],...rows.slice(1).sort((a,b)=>a[0].localeCompare(b[0]))].map(r=>r.map(q).join(",")).join("\r\n");
    await shareFile("Habit Hunter export.csv","text/csv","\ufeff"+body);
  },
};
function setFull(on,quiet){
  if(S.full===on)return;
  S.full=on;document.body.classList.toggle("full",on);$("fsExit").hidden=!on;
  const fs=document.fullscreenElement;
  try{
    if(on&&!fs&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});
    if(!on&&fs&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});
  }catch(e){}
  if(!quiet){window.scrollTo(0,0);render(true)}
}
/* Leaving the browser's full screen (back gesture or Esc) also leaves full-screen stats. */
document.addEventListener("fullscreenchange",()=>{if(!document.fullscreenElement&&S.full)setFull(false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.full&&$("sheet").hidden)setFull(false)});
window.addEventListener("resize",()=>{if(S.tab==="Stats")render()});
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(el&&A[el.dataset.act]){A[el.dataset.act](el);return}
  if(e.target===$("sheet"))closeSheet();
});
document.addEventListener("change",e=>{
  const k=e.target.dataset&&e.target.dataset.change;if(!k)return;
  if(k==="jump"){if(e.target.value&&e.target.value<=S.today){closeEditor();S.day=e.target.value;e.target.blur();render(true)}}
  if(k==="statPick"){S.statHabit=e.target.value;S.bar={};render(true)}
  if(k==="commentPick"){S.commentHabit=e.target.value;S.limit=60;render(true)}
  if(k==="fFreq"){keepNumbers();F.freq=e.target.value;drawDetail()}
  if(k==="restore"){const f=e.target.files&&e.target.files[0];if(f)restoreFrom(f);e.target.value=""}
  if(k==="fGoal"){keepNumbers();F.goalType=e.target.value;F.goalAmount=F.goalType==="minutes"?"20":"2";drawGoal()}
});
document.addEventListener("input",e=>{
  if(e.target.dataset&&e.target.dataset.input==="search"){S.search=e.target.value;S.limit=60;$("clist").innerHTML=commentList()}
});
/* Whatever is typed is kept, even if you tap away or switch apps. */
document.addEventListener("focusout",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.input==="note"&&S.editing)setComment(S.editing.hid,S.editing.day,t.value);
  if(t.closest&&t.closest("#view"))setTimeout(()=>{if(S.dirty&&!typingInView())render()},0);
});
function rollDay(){const t=localToday();if(t!==S.today){closeEditor();if(S.day===S.today)S.day=t;S.today=t;render(true)}}
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){if(S.editing){const e=$(`note-${S.editing.hid}`);if(e)setComment(S.editing.hid,S.editing.day,e.value)}}else rollDay();
});
setInterval(rollDay,30000);

/* ---------- starting up ---------- */
async function start(){
  try{const t=localStorage.getItem("hh-theme");if(t)S.settings.theme=t}catch(e){}
  applyTheme();render(true);
  if(!Cloud){S.blocked="Habit Hunter couldn't start. Check your connection, then close and reopen it.";S.authKnown=true;render(true);return}
  Cloud.init(FIREBASE_CONFIG);
  let stop=null;
  Cloud.onUser(u=>{
    if(stop){stop();stop=null}
    closeEditor();S.editing=null;S.logging=null;
    S.authKnown=true;S.uid=u?u.uid:null;S.email=u?(u.email||""):"";S.habits={};S.logs={};S.loaded=false;S.blocked="";touched();
    if(!u){setFull(false,true);render(true);return}
    const ready={h:false,l:false},got=k=>{ready[k]=true;if(ready.h&&ready.l)S.loaded=true};
    stop=Cloud.watch(u.uid,{
      habits:docs=>{const n={};for(const[id,d]of docs)n[id]=fromCloudHabit(id,d);S.habits=n;got("h");touched();render()},
      logs:docs=>{const n={};for(const[id,d]of docs)n[id]={habit:d.habit,year:d.year,days:{...(d.days||{})}};S.logs=n;got("l");touched();render()},
      settings:d=>{if(d){S.settings={...S.settings,...d};applyTheme();render()}},
      error:e=>{console.warn(e);S.blocked="Your habits couldn't be loaded. Check your connection, then close and reopen the app.";S.loaded=true;render(true)},
    });
    render(true);
  });
  if("serviceWorker"in navigator&&location.protocol==="https:"&&!window.Capacitor)navigator.serviceWorker.register("sw.js").catch(()=>{});
}
start();
</script>
